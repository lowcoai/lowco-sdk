name: lowcoai_flux
description: Official Dart and Flutter client for the lowco flux realtime WebSocket pub/sub service (channels, event filters, auto-reconnect).
version: 0.1.1
repository: https://github.com/lowcoai/lowco-sdk/tree/main/flutter/flux
topics:
  - lowco
  - websocket
  - realtime
  - pubsub
  - sdk

environment:
  sdk: ^3.4.0

dependencies:
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
